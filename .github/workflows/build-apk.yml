name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle React App to Web Assets
        run: |
          npm init -y
          npm install react react-dom lucide-react typescript @types/react @types/react-dom esbuild

          # پیدا کردن فایل سورس اصلی
          SOURCE_FILE=""
          if [ -f "src/App.tsx" ]; then SOURCE_FILE="src/App.tsx";
          elif [ -f "App.tsx" ]; then SOURCE_FILE="App.tsx";
          elif [ -f "pasted-text.txt" ]; then SOURCE_FILE="pasted-text.txt";
          fi

          mkdir -p dist src
          
          # ساخت فایل نقطه ورودی
          cat << 'EOF' > src/entry.tsx
          import React from 'react';
          import ReactDOM from 'react-dom/client';
          import DadKarApp from './AppSource';

          const rootElement = document.getElementById('root');
          if (rootElement) {
            ReactDOM.createRoot(rootElement).render(<DadKarApp />);
          }
          EOF

          cp "$SOURCE_FILE" src/AppSource.tsx

          # کامپایل فوق‌سریع کدهای تایپ‌اسکریپت به جاوااسکریپت استاندارد مرورگر
          npx esbuild src/entry.tsx --bundle --minify --loader:.tsx=tsx --outfile=dist/bundle.js --define:process.env.NODE_ENV='"production"'

          # ساخت فایل index.html نهایی در dist
          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>دادکار</title>
              <script src="https://cdn.tailwindcss.com"></script>
              <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
              <style>
                body {
                  font-family: 'Vazirmatn', sans-serif;
                  margin: 0;
                  padding: 0;
                  background-color: #0f172a;
                  -webkit-user-select: none;
                  user-select: none;
                }
              </style>
            </head>
            <body>
              <div id="root"></div>
              <script src="./bundle.js"></script>
            </body>
          </html>
          EOF

      - name: Setup Capacitor and Sync Android
        run: |
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4
          cat <<EOF > capacitor.config.json
          {
            "appId": "ir.dadkar.app",
            "appName": "دادکار",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: DadKar-Release-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
