name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bundle React App to Web Assets
        run: |
          npm init -y
          npm install react react-dom lucide-react typescript @types/react @types/react-dom esbuild

          SOURCE_FILE=""
          if [ -f "src/App.tsx" ]; then SOURCE_FILE="src/App.tsx";
          elif [ -f "App.tsx" ]; then SOURCE_FILE="App.tsx";
          elif [ -f "pasted-text.txt" ]; then SOURCE_FILE="pasted-text.txt";
          fi

          mkdir -p dist src
          
          cat << 'EOF' > src/entry.tsx
          import React from 'react';
          import ReactDOM from 'react-dom/client';
          import DadKarApp from './AppSource';

          const rootElement = document.getElementById('root');
          if (rootElement) {
            ReactDOM.createRoot(rootElement).render(<DadKarApp />);
          }
          EOF

          cp "$SOURCE_FILE" src/AppSource.tsx

          npx esbuild src/entry.tsx --bundle --minify --loader:.tsx=tsx --outfile=dist/bundle.js --define:process.env.NODE_ENV='"production"'

          cat << 'EOF' > dist/index.html
          <!DOCTYPE html>
          <html lang="fa" dir="rtl">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
              <title>دادکار</title>
              <script src="https://cdn.tailwindcss.com"></script>
              <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
              <style>
                body {
                  font-family: 'Vazirmatn', sans-serif;
                  margin: 0;
                  padding: 0;
                  background-color: #090d16;
                  -webkit-user-select: none;
                  user-select: none;
                }
              </style>
            </head>
            <body>
              <div id="root"></div>
              <script src="./bundle.js"></script>
            </body>
          </html>
          EOF

      - name: Setup Capacitor and Generate App Assets
        run: |
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4
          
          # تنظیم نمایش اولیه دقیقاً ۲ ثانیه برای لوگو قبل از لودینگ
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "ir.dadkar.app",
            "appName": "دادکار",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "plugins": {
              "SplashScreen": {
                "launchShowDuration": 2000,
                "launchAutoHide": true,
                "backgroundColor": "#090d16",
                "androidSplashResourceName": "splash"
              }
            }
          }
          EOF

          npx cap add android

          # تزریق و تبدیل دقیق icon.svg به آیکون‌های لانچر و اسپلش‌اسکرین
          if [ -f "icon.svg" ]; then
            sudo apt-get update && sudo apt-get install -y librsvg2-bin imagemagick
            RES_DIR="android/app/src/main/res"

            declare -A SIZES=( ["mipmap-mdpi"]=48 ["mipmap-hdpi"]=72 ["mipmap-xhdpi"]=96 ["mipmap-xxhdpi"]=144 ["mipmap-xxxhdpi"]=192 )
            for DIR in "${!SIZES[@]}"; do
              SIZE="${SIZES[$DIR]}"
              TARGET_DIR="$RES_DIR/$DIR"
              mkdir -p "$TARGET_DIR"
              rsvg-convert -w "$SIZE" -h "$SIZE" icon.svg -o "$TARGET_DIR/ic_launcher.png"
              rsvg-convert -w "$SIZE" -h "$SIZE" icon.svg -o "$TARGET_DIR/ic_launcher_round.png"
              rsvg-convert -w "$SIZE" -h "$SIZE" icon.svg -o "$TARGET_DIR/ic_launcher_foreground.png"
            done

            rsvg-convert -w 512 -h 512 icon.svg -o /tmp/logo512.png
            convert -size 1080x1920 xc:"#090d16" /tmp/logo512.png -gravity center -composite /tmp/splash_rendered.png

            for SPLASH_DIR in $(find "$RES_DIR" -type d -name "drawable*"); do
              if [ -f "$SPLASH_DIR/splash.png" ]; then
                cp /tmp/splash_rendered.png "$SPLASH_DIR/splash.png"
              fi
            done
            cp /tmp/splash_rendered.png "$RES_DIR/drawable/splash.png" || true
          fi

          npx cap sync android

      - name: Generate Official Release Keystore & Build Signed Release APK
        run: |
          cd android
          # ایجاد کلید رسمی Release معتبر اختصاصی دادکار
          keytool -genkeypair -v -keystore release.keystore -alias dadkar -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "DadKarSecureKey2026" -keypass "DadKarSecureKey2026" \
            -dname "CN=Seyed Hossein Hejazi, OU=IT, O=DadKar, L=Isfahan, ST=Isfahan, C=IR"

          # تنظیم Gradle برای امضای اتوماتیک با فایل Keystore اختصاصی
          cat << 'EOF' >> app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file('../release.keystore')
                      storePassword 'DadKarSecureKey2026'
                      keyAlias 'dadkar'
                      keyPassword 'DadKarSecureKey2026'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
                  }
              }
          }
          EOF

          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Finished Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: DadKar-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
