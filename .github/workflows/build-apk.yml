name: Build Android APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets
        run: |
          mkdir -p dist
          cp index.html dist/
          cp -r src dist/ 2>/dev/null || true

      - name: Setup Capacitor Configuration
        run: |
          npm init -y
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4
          cat <<EOF > capacitor.config.json
          {
            "appId": "ir.dadkar.app",
            "appName": "DadKar",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK File
        uses: actions/upload-artifact@v4
        with:
          name: DadKar-Installable-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
