<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="dkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="dkBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- پس‌زمینه کارت با گوشه‌های گرد مدرن اندروید -->
  <rect width="512" height="512" rx="115" fill="url(#dkBg)"/>
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="url(#dkBorder)" stroke-width="14" opacity="0.9"/>

  <!-- مونوگرام DK -->
  <g>
    <!-- حرف D -->
    <path d="M 140 110 L 220 110 C 310 110 350 160 350 256 C 350 352 310 402 220 402 L 140 402 Z" 
          fill="none" stroke="#38bdf8" stroke-width="38" stroke-linejoin="round"/>
    
    <!-- حرف K -->
    <path d="M 245 256 L 375 125" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
    <path d="M 245 256 L 385 390" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round"/>
    
    <!-- نقاط نورانی -->
    <circle cx="375" cy="125" r="18" fill="#60a5fa"/>
    <circle cx="385" cy="390" r="18" fill="#38bdf8"/>
  </g>
</svg>
